[release]
tag-prefix = "v"

[build]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-gnu"]
profile = "release"
locked = true

[package]
format = "both"

[[package.bundles]]
name = "portable"
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-gnu"]
formats = { x86_64-pc-windows-gnu = "zip", x86_64-unknown-linux-gnu = "tgz" }
archive-name = "{name}-{bundle}-{target}-v{version}"
root = "{name}-{bundle}-{target}-v{version}"
cargo-binaries = "all"
files = [
  { source = "assets/window-icon.png", destination = "pdf-presenter.png" },
  { source = "scripts/install-linux-launcher.py", destination = "install-linux-launcher.py", workspace-relative = true },
  { source = "LICENSE", destination = "LICENSE.txt", workspace-relative = true },
  { source = "docs/portable-quickstart.txt", destination = "README.txt", workspace-relative = true },
]

[[repository.fallbacks]]
origin = "https://git.dandaedre.com/idle-org/pdf-presenter"
fallback-url = "https://proxy.dandaedre.com/gitea/idle-org/pdf-presenter"

[gitea]
token-env = "GITEA_TOKEN"
