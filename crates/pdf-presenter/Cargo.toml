[package]
name = "pdf-presenter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable multiscreen PDF and image presenter"

[dependencies]
sys-locale = "=0.3.2"
winit = "=0.30.13"
softbuffer = { version = "=0.4.8", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
font8x8 = "=0.3.1"

egui = { version = "=0.34.1", features = ["default_fonts"] }
egui-winit = { version = "=0.34.1", default-features = false, features = ["x11", "wayland"] }
egui_software_backend = { version = "=0.0.3", default-features = false, features = ["std", "rayon"] }
bytemuck = "1.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "6"
tempfile = "3"
sha2 = "0.10"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
hayro = "=0.9.0"
chrono = "0.4"
rfd = "=0.15.4"
sysinfo = { version = "=0.37.2", default-features = false, features = ["system"] }

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
keepawake = "=0.6.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "=2.21.0"
wayland-client = { version = "=0.31.15", features = ["system", "dlopen"] }
wayland-protocols = { version = "=0.32.13", features = ["client"] }

[build-dependencies]
winresource = "=0.1.17"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }.tgz"
pkg-fmt = "tgz"
bin-dir = "{ name }-{ target }-v{ version }/{ bin }{ binary-ext }"
