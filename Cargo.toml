[workspace]
members = ["crates/deckstride"]
default-members = ["crates/deckstride"]
resolver = "3"

[workspace.package]
version = "0.1.97"
edition = "2024"
license = "MIT"
repository = "https://proxy.dandaedre.com/gitea/idle-org/deckstride"

[profile.dev]
debug = 0

[profile.release]
strip = true

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
egui_software_backend = { path = "vendor/egui_software_backend" }
