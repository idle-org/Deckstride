version = 1
auto_show = true
zoom_enabled = false
zoom_keep_fitted_area = false
theme = "midra"
language = "system"
presenter_fullscreen = true
presentation_fullscreen = true
thumbnail_size = 220.0
buffer_mib = 1024

[slide_colors]
page_background = [255, 255, 255]
fit_padding = [0, 0, 0]

[routes]
presenter = ["Primary#1"]
presentation = ["Projector#1"]

[layout]
elapsed_position = "above_slides"
clock_position = "below_notes"
slide_progress = true
slide_progress_height = 32.0
timer_mode = "countdown"
countdown_seconds = 1200
timer_autostart = true
header = true
footer = false

[layout.current]
show = false
size = 60.0
