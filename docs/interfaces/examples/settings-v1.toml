version = 1
# Optional slide-first view on an operator-owned route (0.1.89+).
single_screens = ["Primary#1"]
auto_show = true
blank_picture = false
zoom_enabled = false
zoom_keep_fitted_area = false
theme = "midra"
language = "system"
presenter_fullscreen = true
presentation_fullscreen = true
thumbnail_size = 220.0
buffer_mib = 1024

[disk_cache]
max_mib = 10240
max_days = 30

[slide_colors]
page_background = [255, 255, 255]
fit_padding = [0, 0, 0]

[routes]
presenter = ["Primary#1"]
presentation = ["Projector#1"]

[layout]
elapsed_position = "above_slides"
clock_position = "below_notes"
slide_progress = true
slide_progress_height = 32.0
timer_mode = "countdown"
countdown_seconds = 1200
timer_autostart = true
header = true
footer = false

[layout.current]
show = false
size = 60.0

# Optional per-display visual profiles (0.1.76+).
[display_layouts."Secondary#1".layout]
header = false
clock_position = "left_of_slides"

[display_layouts."Secondary#1".layout.notes]
show = false
size = 35.0

[display_layouts."Secondary#1".projects."0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"]
slide_progress = true
slide_progress_height = 40.0

# Per-screen mode overrides (0.1.87+), independent of display roles.
[screen_modes]
"Primary#1" = "always_windowed"
"Secondary#1" = "always_fullscreen"
"Third#1" = "follow_global"
